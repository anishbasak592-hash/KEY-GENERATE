<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG GAMER BOY FF — Access Key</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0b0b0e;
  --card:#15151a;
  --field:#0d0d10;
  --text:#f5f5f7;
  --muted:#9b9ba3;
  --line:#292930;
  --accent:#e52b3f;
  --accent2:#ff5363;
}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,rgba(229,43,63,.25),transparent 38%),
    linear-gradient(180deg,#1a0b0e 0%,var(--bg) 30%,#070709 100%);
}
.topbar{
  height:7px;
  background:linear-gradient(90deg,#9e1525,var(--accent),#ff6977);
}
.wrap{
  width:min(94%,520px);
  margin:45px auto 28px;
}
.brand{
  text-align:center;
  margin-bottom:24px;
}
.logo{
  width:82px;
  height:82px;
  margin:0 auto 14px;
  border-radius:24px;
  display:grid;
  place-items:center;
  font-size:52px;
  font-weight:900;
  color:#fff;
  background:linear-gradient(145deg,#1c1c22,#08080a);
  border:1px solid #36363e;
  box-shadow:0 18px 45px rgba(0,0,0,.45),0 0 35px rgba(229,43,63,.16);
}
h1{
  margin:0;
  font-size:28px;
  letter-spacing:.3px;
}
.brand p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
}
.card{
  background:rgba(21,21,26,.96);
  border:1px solid #303039;
  border-radius:24px;
  padding:25px 21px 23px;
  box-shadow:0 24px 70px rgba(0,0,0,.48);
}
.heading{
  padding:13px 15px;
  margin-bottom:21px;
  border-radius:12px;
  background:linear-gradient(90deg,rgba(229,43,63,.13),rgba(255,83,99,.05));
  border:1px solid rgba(229,43,63,.18);
  text-align:center;
  font-size:14px;
  color:#d9d9df;
}
.step-box{
  min-height:185px;
  border:1px solid #303039;
  border-radius:15px;
  background:linear-gradient(180deg,#111116,#0d0d10);
  padding:24px 17px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.step-number{
  color:#ff5b6b;
  font-size:11px;
  font-weight:850;
  letter-spacing:1px;
  margin-bottom:10px;
}
.step-icon{
  width:48px;
  height:48px;
  margin:0 auto 12px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:rgba(229,43,63,.11);
  border:1px solid rgba(229,43,63,.25);
  font-size:21px;
}
.step-title{
  font-size:17px;
  font-weight:850;
}
.timer{
  margin-top:12px;
  color:#ff6372;
  font-size:13px;
  font-weight:800;
}
.next{
  width:100%;
  height:54px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  color:white;
  font-weight:850;
  font-size:15px;
  letter-spacing:.5px;
  cursor:pointer;
  background:linear-gradient(135deg,#c91e32,var(--accent),var(--accent2));
  box-shadow:0 12px 28px rgba(229,43,63,.22);
}
.next:disabled{
  opacity:.45;
  cursor:not-allowed;
  box-shadow:none;
}
.result{
  display:none;
  margin-top:18px;
  padding:18px 15px;
  border-radius:14px;
  border:1px solid rgba(67,227,138,.25);
  background:rgba(67,227,138,.055);
}
.result-label{
  text-align:center;
  color:#8f9691;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:9px;
}
.key{
  text-align:center;
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
  word-break:break-all;
  color:#eafff2;
}
.copy{
  display:block;
  width:100%;
  height:43px;
  margin-top:13px;
  border-radius:10px;
  border:1px solid rgba(67,227,138,.28);
  background:#101713;
  color:#7ff0ac;
  font-weight:800;
  cursor:pointer;
}
footer{
  text-align:center;
  margin-top:20px;
  color:#676770;
  font-size:11px;
}
@media(max-width:420px){
  .wrap{margin-top:30px}
  .card{padding:22px 17px 20px}
  h1{font-size:25px}
}
</style>
</head>
<body>
<div class="topbar"></div>

<main class="wrap">
  <section class="brand">
    <div class="logo">R</div>
    <h1>RG GAMER BOY FF</h1>
    <p>Access Key</p>
  </section>

  <section class="card">
    <div class="heading" id="heading">Complete verification to continue</div>

    <div class="step-box">
      <div class="step-number" id="stepNumber">STEP 1</div>
      <div class="step-icon" id="stepIcon">🛡️</div>
      <div class="step-title" id="stepTitle">Security Verification</div>
      <div class="timer" id="timer">10s</div>
    </div>

    <button class="next" id="nextBtn" disabled>WAIT...</button>

    <div class="result" id="result">
      <div class="result-label">ACCESS KEY</div>
      <div class="key" id="keyOutput"></div>
      <button class="copy" id="copyBtn">COPY ACCESS KEY</button>
    </div>
  </section>

  <footer>RG GAMER BOY FF</footer>
</main>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByc4PP-Tglp-Seynuu8CTllNiQ3PSa1E8",
    authDomain: "rg-gamer-boy-ff-store.firebaseapp.com",
    databaseURL: "https://rg-gamer-boy-ff-store-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rg-gamer-boy-ff-store",
    storageBucket: "rg-gamer-boy-ff-store.firebasestorage.app",
    messagingSenderId: "1057271668760",
    appId: "1:1057271668760:web:cf404473d0ab32171c236d",
    measurementId: "G-YTXTLFW0NV"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getDatabase(firebaseApp);

  window.RG_FIREBASE = { db, ref, set, get };
</script>

<script>
const stepData=[
  ["🛡️","Security Verification"],
  ["⚡","System Verification"],
  ["🔎","Access Verification"],
  ["🌐","Connection Verification"],
  ["🔐","Identity Verification"],
  ["⚙️","System Check"],
  ["📡","Session Verification"],
  ["🧩","Security Check"],
  ["🚀","Final Verification"],
  ["✅","Final Check"]
];

const totalSteps=Math.floor(Math.random()*6)+5;
let currentStep=0;
let timerValue=10;

const stepNumber=document.getElementById("stepNumber");
const stepIcon=document.getElementById("stepIcon");
const stepTitle=document.getElementById("stepTitle");
const timer=document.getElementById("timer");
const nextBtn=document.getElementById("nextBtn");
const heading=document.getElementById("heading");
const result=document.getElementById("result");
const keyOutput=document.getElementById("keyOutput");
const copyBtn=document.getElementById("copyBtn");

function randomChar(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return chars[Math.floor(Math.random()*chars.length)];
}

function block(){
  let s="";
  for(let i=0;i<4;i++) s+=randomChar();
  return s;
}

function createKey(){
  return "RGBFF-"+block()+"-"+block()+"-"+block();
}

function showStep(){
  const data=stepData[currentStep];
  stepNumber.textContent="STEP "+(currentStep+1);
  stepIcon.textContent=data[0];
  stepTitle.textContent=data[1];
  timerValue=10;
  timer.textContent=timerValue+"s";
  nextBtn.disabled=true;
  nextBtn.textContent="WAIT...";

  const countdown=setInterval(()=>{
    timerValue--;
    timer.textContent=timerValue+"s";

    if(timerValue<=0){
      clearInterval(countdown);
      nextBtn.disabled=false;
      nextBtn.textContent=currentStep===totalSteps-1 ? "GENERATE KEY" : "NEXT STEP";
      timer.textContent="Complete";
    }
  },1000);
}

nextBtn.addEventListener("click",async ()=>{
  if(nextBtn.disabled) return;

  if(currentStep<totalSteps-1){
    currentStep++;
    showStep();
  }else{
    nextBtn.disabled = true;
    nextBtn.textContent = "CHECKING...";

    try{
      const { db, ref, set, get } = window.RG_FIREBASE;
      const masterRef = ref(db, "settings/masterAccessKey");
      const masterSnap = await get(masterRef);

      let key;
      if(masterSnap.exists() && typeof masterSnap.val() === "string" && masterSnap.val().trim()){
        // One permanent key: once created, every future generation shows the same key.
        key = masterSnap.val().trim().toUpperCase();
      }else{
        key = createKey();
        await set(masterRef, key);
      }

      // The key is intentionally unlimited-use. Register only needs the key to exist.
      await set(ref(db, "accessKeys/" + key), {
        status: "unlimited",
        unlimited: true,
        createdAt: Date.now()
      });

      keyOutput.textContent = key;
      result.style.display = "block";
      heading.textContent = "Verification completed";
      stepNumber.textContent = "COMPLETED";
      stepIcon.textContent = "✅";
      stepTitle.textContent = "Access Key Ready";
      timer.textContent = "";
      nextBtn.style.display = "none";
    }catch(err){
      console.error("Firebase key save failed:", err);
      nextBtn.disabled = false;
      nextBtn.textContent = "GENERATE KEY";
      timer.textContent = "Firebase save failed";
      alert("Access key save नहीं हो पाया। Firebase connection और Database Rules check करें।");
    }
  }
});

copyBtn.addEventListener("click", async()=>{
  const key = keyOutput.textContent.trim();
  if(!key) return;

  // Always try the Clipboard API first. GitHub Pages is HTTPS, so this
  // works in supported browsers. The manual-selection fallback below
  // handles browsers that block clipboard access.
  try{
    if(navigator.clipboard && typeof navigator.clipboard.writeText === "function"){
      await navigator.clipboard.writeText(key);
      copyBtn.textContent="COPIED ✓";
      setTimeout(()=>copyBtn.textContent="COPY ACCESS KEY",1500);
      return;
    }
    throw new Error("Clipboard API unavailable");
  }catch(err){
    // Fallback: select the key text so the user can tap Copy manually.
    try{
      const range=document.createRange();
      range.selectNodeContents(keyOutput);
      const selection=window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      copyBtn.textContent="SELECTED — TAP COPY";
      setTimeout(()=>copyBtn.textContent="COPY ACCESS KEY",2500);
    }catch(fallbackError){
      // Last resort: show the key in a prompt, where it can be copied.
      window.prompt("Copy your Access Key:", key);
    }
  }
});

showStep();
</script>
</body>
</html>
